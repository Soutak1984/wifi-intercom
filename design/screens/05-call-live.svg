<text x="48" y="468" fill="#F6F1E8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="550" text-anchor="start">Floor 2 hears you. Their microphone does not follow yours.</text>
<text x="48" y="508" fill="#A89888" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Mute frames are silence, so the far speaker stays quiet without a click.</text>
<text x="48" y="540" fill="#A89888" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">The live state is the only time voice leaves this station.</text>
